
name: PriceRush Daily Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricerush-daily-automation
  cancel-in-progress: false

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check script syntax
        run: |
          node --check scripts/import-open-prices.mjs
          node --check scripts/validate-products.mjs
          node --check scripts/run-daily-automation.mjs

      - name: Run PriceRush automation
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-daily-automation.mjs
